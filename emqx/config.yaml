---
name: EMQX
version: 5.10.5-3
slug: emqx
description: Version 5.10.5-3
url: https://github.com/raphael1688dev/addon-emqx
startup: services
ingress: true
ingress_port: 18083
ingress_stream: true
init: false
panel_icon: mdi:pipe
panel_title: EMQX
arch:
  - aarch64
  - amd64
map:
  - ssl
  - addon_config:rw
options:
  mqtt_port: 1883
  mqtts_port: 8883
  websocket_port: 8083
  wss_port: 8084
  log_level: warning
  ssl_certfile: "/ssl/fullchain.pem"
  ssl_keyfile: "/ssl/privkey.pem"
  ssl_cacertfile: ""
  telemetry_enable: false
  max_packet_size: "1MB"
  env_vars: []
host_network: true
schema:
  default_admin_password: password?
  mqtt_port: port
  mqtts_port: port
  websocket_port: port
  wss_port: port
  log_level: list(debug|info|warning|error|critical)
  ssl_certfile: str?
  ssl_keyfile: str?
  ssl_cacertfile: str?
  telemetry_enable: bool
  max_packet_size: str
  env_vars:
    - name: match(^EMQX_([A-Z0-9_])+$)
      value: str

